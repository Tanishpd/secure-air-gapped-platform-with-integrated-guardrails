# Credentials that must never reach the model. BLOCK-list members (entities.yaml).
recognizers:
  - entity: API_KEY
    context: [api, key, token, secret, authorization, bearer]
    patterns:
      - { name: aws_access_key, regex: '\bAKIA[0-9A-Z]{16}\b', score: 0.90 }
      - { name: sk_token, regex: '\bsk-[A-Za-z0-9]{20,}\b', score: 0.85 }
      - { name: github_pat, regex: '\bghp_[A-Za-z0-9]{36}\b', score: 0.90 }
  - entity: PRIVATE_KEY
    patterns:
      - name: pem
        regex: '-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
        score: 0.99
