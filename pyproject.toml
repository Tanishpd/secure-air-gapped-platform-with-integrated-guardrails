[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagp"
description = "Secure Air-Gapped Platform with Integrated Guardrails"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dynamic = ["version"]
authors = [{ name = "Tanish P D" }]

# Runtime closure for the sealed .venv. NO torch / transformers / huggingface-hub
# (invariant 10) — those live in the provisioning venv only. Versions are the
# canonical pins from BLUEPRINT §2.1; `make lock` turns these into the
# hash-pinned requirements.runtime.lock at M1.
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.32",
  "presidio-analyzer==2.2.364",
  "presidio-anonymizer==2.2.364",
  "spacy==3.8.14",
  "onnxruntime==1.28.0",
  "tokenizers==0.23.1",
  "numpy>=1.26,<2.5.0",
  "qdrant-client==1.18.0",
  "ollama==0.6.2",
  "pypdf==6.14.2",
  "pyyaml>=6.0.3,<7",
  "regex>=2024.11",
  "psutil==7.2.2",
  "phonenumbers==9.0.35",
  "tldextract==5.3.1",
  "cryptography>=48.0.1,<50",
  "grpcio==1.83.0",
  "protobuf>=4.25.8,<8",
  "httpx==0.28.1",
]

[project.optional-dependencies]
# Test + lint loop. Installed into .venv (the runtime venv), never shipped sealed.
dev = [
  "pytest==9.1.1",
  "hypothesis==6.165.10",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.3",
  "mypy==2.3.1",
  "types-PyYAML==6.0.12.20260815",
  # Supply-chain: CVE gate (`make audit-deps`) + SBOM generation (`make sbom`).
  "pip-audit==2.10.1",
  "cyclonedx-bom==7.3.1",
  # SAST over shipped code (`make sast`). CodeQL is the deeper option but needs GHAS
  # (this repo is private); bandit runs anywhere and gates in CI today.
  "bandit==1.9.4",
]
# thinc-apple-ops (Accelerate BLAS for spaCy) is an opt-in perf extra; kept out of
# the default closure so M0 installs from wheels without a source build.
apple = ["thinc-apple-ops==1.0.0"]

[project.scripts]
sagp = "sagp.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sagp = ["py.typed", "llm/prompts/*.txt"]

[tool.setuptools.dynamic]
version = { attr = "sagp.version.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection puts calls (Depends/Header/…) in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.11"
packages = ["sagp"]
mypy_path = "src"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
# Third-party packages without type stubs — ignore missing imports until stubs land.
[[tool.mypy.overrides]]
module = [
  "presidio_analyzer.*",
  "presidio_anonymizer.*",
  "spacy.*",
  "onnxruntime.*",
  "qdrant_client.*",
  "ollama.*",
  "pypdf.*",
  "tldextract.*",
  "phonenumbers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "needs_models: requires models/ verified against MANIFEST.json",
  "needs_ollama: requires a reachable 127.0.0.1:11434 with the pinned tag",
]
