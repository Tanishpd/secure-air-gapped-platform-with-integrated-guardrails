# PROFILE=demo / proof — the Qdrant container that is the demonstration path. The
# default runtime backend is EMBEDDED Qdrant (no Docker); this file is only for
# the demo.
#
# NETWORK ISOLATION IS NOT PROVIDED BY DOCKER OPTIONS (ADR-0002; `make spike-docker`
# run 2026-08-01, evidence/spike-docker.json). The spike resolved OQ-4/OQ-5 on
# Docker Desktop 29.5.3, negatively:
#   OQ-4: with `internal: true`, a published 127.0.0.1 port is accepted and the
#         container runs, but the HOST cannot reach it (http_code=000). The sagp
#         app runs on the host, so `internal: true` would make Qdrant unreachable.
#         => this file uses a NON-internal bridge so the app can reach Qdrant.
#   OQ-5: `enable_ip_masquerade=false` does NOT block egress on a reachable
#         network (Docker Desktop egresses via a userland VM proxy — TCP reached,
#         DNS resolved in the spike). DNS also resolves even on an internal net.
# CONCLUSION: egress control for this container must come from the host pf anchor
# (`make seal-pf`, deferred) + loopback binding, NOT from Docker networking. Do
# not call this path "isolated" on the strength of the options below.

services:
  qdrant:
    image: qdrant/qdrant:v1.18.3-unprivileged
    # Pin the digest in artifacts.lock; the tag is mutable.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Loopback ONLY — never 0.0.0.0. This is the host↔Qdrant path the app needs;
      # OQ-4 showed it only routes on a NON-internal network.
      - "127.0.0.1:6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    tmpfs:
      - /tmp
    networks:
      - sagp_vec
    restart: "no"

networks:
  sagp_vec:
    # NOT `internal: true` — OQ-4: an internal network makes the published port
    # unreachable from the host. `enable_ip_masquerade=false` is kept as a
    # belt-and-suspenders marker, but OQ-5 showed it does NOT actually block egress
    # on Docker Desktop; the pf anchor is what controls this container's egress.
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
